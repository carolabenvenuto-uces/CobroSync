name: Capturas celular (temporal)
on:
  push:
    branches: ['diag/**']
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install chromium
      - name: Sacar capturas en tamaño celular
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 5
          node scripts/capturas-celular.mjs
      - name: Subir las capturas a la rama
        run: |
          git config user.name "capturas"
          git config user.email "capturas@users.noreply.github.com"
          git checkout -B diag/capturas-resultado
          git add -f capturas-celular
          git commit -m "capturas" -q
          git push -f origin diag/capturas-resultado
