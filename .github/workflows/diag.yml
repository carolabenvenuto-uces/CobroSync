name: Diagnostico temporal
on:
  push:
    branches: ['diag/**']
jobs:
  ubicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:google
      - name: Mostrar el codigo donde falla
        run: |
          python3 - dist-google/paquete/Index.html <<'PY'
          import sys,re
          t=open(sys.argv[1],encoding='utf-8').read()
          for k,v in enumerate(t.split('\n')): print('linea',k+1,len(v))
          for nombre in ['ju','uP','s9']:
              for m in re.finditer(r'(function '+nombre+r'\(|[,;{ ]'+nombre+r'=)', t):
                  i=m.start(); print('====',nombre,i); print(t[i:i+700])
          PY
